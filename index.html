<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRADO - Premium Elektro-Fahrräder</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Kopfzeile -->
    <header class="header">
        <div class="container header-top">
            <a class="logo" href="index.html">
                <img src="logo/Logo.png" alt="MRADO" class="site-logo">
            </a>
        </div>
    </header>

    <!-- Produktbereich -->
    <section id="products" class="products">
        <div class="container">
            <h2>Unsere Produkte</h2>

            <div class="catalog-toolbar">
                <div class="category-section">
                    <div class="category-cards" id="categoryCards" role="group" aria-label="Kategorie"></div>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Marke</span>
                    <div class="filter-chips" id="brandFilter" role="group" aria-label="Marke"></div>
                </div>
            </div>

            <div id="productsList" class="products-grid">
                <!-- Products will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Kontaktbereich -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>Kontakt</h2>
            <p>Haben Sie Fragen? Schreiben Sie uns Ihre Anfrage über das Formular.</p>

            <div class="inquiry-section">
                <h3>Anfrage senden</h3>
                <form id="inquiryForm" class="inquiry-form" action="https://formsubmit.co/ea2e661910e6d62498bce0022bd85aac " method="POST">
                    <input type="hidden" name="_subject" value="Neue Anfrage von Ihrer Website">
                    <input type="hidden" name="_template" value="table">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_honey" value="">
                    <input type="hidden" name="productId" id="productId" value="">
                    <input type="hidden" name="productName" id="productName" value="">
                    <input type="hidden" name="sourcePage" id="sourcePage" value="main">

                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-Mail *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Telefon *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label for="company">Firma</label>
                        <input type="text" id="company" name="company">
                    </div>

                    <div class="form-group">
                        <label for="message">Nachricht *</label>
                        <textarea id="message" name="message" rows="5" placeholder="Beschreiben Sie Ihre Anfrage..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Anfrage senden</button>
                    <p class="form-note">* Pflichtfelder</p>
                </form>
            </div>
        </div>
    </section>

    <!-- Fußzeile -->
    <footer class="footer">
        <div class="container">
            <nav class="footer-links" aria-label="Rechtliches">
                <a href="impressum.html">Impressum</a>
                <a href="datenschutz.html">Datenschutzerklärung</a>
                <a href="agb.html">AGB</a>
                <a href="widerruf.html">Widerrufsbelehrung</a>
                <a href="garantie.html">Herstellergarantie</a>
            </nav>
            <p>&copy; 2026 MRADO. Alle Rechte vorbehalten.</p>
        </div>
    </footer>

    <script src="app.js?v=2"></script>
</body>
</html>
