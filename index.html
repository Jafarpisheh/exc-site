<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRADO – Demnächst verfügbar</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
        }

        .site-logo {
            width: clamp(180px, 40vw, 280px);
            height: auto;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }

        .divider {
            width: 60px;
            height: 3px;
            background-color: #38bdf8;
            border-radius: 2px;
            margin: 0 auto 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo/Logo.png" alt="MRADO Logo" class="site-logo">
        <h2>Bald geht es los</h2>
    </div>
</body>
</html>
