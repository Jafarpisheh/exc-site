<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRADO - E-Scooter & E-Bikes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
    <!-- Kopfzeile -->
    <header class="header">
        <div class="container header-top">
            <a class="logo" href="index.html">
                <img src="logo/Logo.png" alt="MRADO" class="site-logo">
            </a>
        </div>
    </header>

    <!-- Produktbereich -->
    <section id="products" class="products">
        <div class="container">
            <h2>Unsere Produkte</h2>
        </div>

        <div class="catalog-wrap">
            <div class="catalog-toolbar">
                <div class="category-section">
                    <div class="category-cards" id="categoryCards" role="group" aria-label="Kategorie"></div>
                </div>
            </div>

            <div class="catalog-filters">
                <div class="brand-section">
                    <label class="filter-label" for="brandSelect">Marke</label>
                    <select id="brandSelect" class="catalog-input catalog-select" aria-label="Marke filtern">
                        <option value="all">Alle Marken</option>
                    </select>
                </div>

                <div class="sort-group">
                    <label class="filter-label" for="sortSelect">Sortierung</label>
                    <select id="sortSelect" class="catalog-input catalog-select" aria-label="Produkte sortieren">
                        <option value="price-asc">Preis aufsteigend</option>
                        <option value="price-desc">Preis absteigend</option>
                        <option value="range-desc">Reichweite (max)</option>
                        <option value="battery-desc">Akku (Kapazität)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="products-area">
            <div id="productsList" class="products-grid">
                <!-- Products will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Fußzeile -->
    <footer class="footer">
        <div class="container">
            <nav class="footer-links" aria-label="Rechtliches">
                <a href="kontakt.html">Kontakt</a>
                <a href="impressum.html">Impressum</a>
                <a href="datenschutz.html">Datenschutzerklärung</a>
                <a href="agb.html">AGB</a>
                <a href="widerruf.html">Widerrufsbelehrung</a>
                <a href="garantie.html">Herstellergarantie</a>
            </nav>
            <p>&copy; 2026 MRADO. Alle Rechte vorbehalten.</p>
        </div>
    </footer>

    <script src="app.js?v=5"></script>
</body>
</html>
